<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTM – Contract & Claim Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* PREMIUM BACKGROUND — Teal Gradient Mesh */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(27,175,191,0.25), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(6,42,46,0.35), transparent 60%),
                #0A1F22;
            background-attachment: fixed;
            color: #EAF6F7;
            overflow-x: hidden;
        }

        /* Fade-in animation */
        .fade-in { opacity: 0; transform: translateY(20px); animation: fadeIn 1.2s ease forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* Header */
        header {
            background: #062A2E;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        /* LOGO FIX — Option A (invert + brightness + white outline) */
        header img {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: brightness(2) invert(1) drop-shadow(0 0 6px rgba(255,255,255,0.8));

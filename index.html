<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTM – Contract & Claim Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* PREMIUM BACKGROUND — Teal Gradient Mesh */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(27,175,191,0.25), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(6,42,46,0.35), transparent 60%),
                #0A1F22;
            background-attachment: fixed;
            color: #EAF6F7;
            overflow-x: hidden;
        }

        /* Fade-in animation */
        .fade-in { opacity: 0; transform: translateY(20px); animation: fadeIn 1.2s ease forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* Header */
        header {
            background: #062A2E;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        /* Logo with frosted background (Option B) */
        header img {
            height: 55px;
            width: auto;
            object-fit: contain;
            background: rgba(255,255,255,0.18);
            padding: 6px 14px;
            border-radius: 10px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 10px rgba(0,0,0,0.45);
        }

        @media (max-width: 600px) {
            header img {
                height: 45px;
                padding: 4px 10px;
            }
        }

        nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: 500; }
        .lang-switch { margin-left: 20px; cursor: pointer; font-weight: 600; }

        /* HERO + subtle animation */
        .hero {
            padding: 160px 40px;
            text-align: center;
            color: white;
            background:
                linear-gradient(to bottom right, rgba(6, 42, 46, 0.85), rgba(27, 175, 191, 0.35)),
                url('hero-bg.jpg') center/cover no-repeat;
            animation: heroFade 1.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
            background-attachment: fixed;
        }

        @keyframes heroFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* NEW — RTM Title */
        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 64px;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        .hero h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 46px;
            margin-bottom: 10px;
        }

        .btn {
            background: #1BAFBF;
            color: white;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-top: 20px;
        }

        /* Sections */
        section {
            background: #0E3A40;
            padding: 80px 40px;
            margin: 40px auto;
            max-width: 1100px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        }

        section:nth-of-type(even):not(.hero) { background: #10464D; }

        h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 30px;
            margin-bottom: 20px;
            position: relative;
        }

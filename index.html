<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTM – Contract & Claim Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #F7F7F7;
            color: #0A1A2F;
            direction: ltr;
            overflow-x: hidden;
        }

        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background: #0A1A2F;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header img {
            height: 42px;
        }

        nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 500;
        }

        .lang-switch {
            margin-left: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        /* HERO SECTION */
        .hero {
            padding: 160px 40px;
            text-align: center;
            color: white;
            background:
                linear-gradient(to bottom right, rgba(10, 26, 47, 0.75), rgba(27, 175, 191, 0.55)),
                url('hero-bg.jpg') center/cover no-repeat;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.4);
        }

        .hero h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 46px;
            margin-bottom: 10px;
        }
